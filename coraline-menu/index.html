<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coraline — Main Menu</title>
  <link rel="stylesheet" href="css/menu.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="btnFace" cx="38%" cy="32%" r="75%">
        <stop offset="0" stop-color="#4a4854"/>
        <stop offset="0.45" stop-color="#16151c"/>
        <stop offset="1" stop-color="#030305"/>
      </radialGradient>
      <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6d7288"/>
        <stop offset="0.5" stop-color="#e8ecf8"/>
        <stop offset="1" stop-color="#9aa0b8"/>
      </linearGradient>
      <radialGradient id="titleBtnFace" cx="36%" cy="30%" r="80%">
        <stop offset="0" stop-color="#f3f1f6"/>
        <stop offset="0.45" stop-color="#b9bed6"/>
        <stop offset="1" stop-color="#5f6688"/>
      </radialGradient>
      <!-- the button that stands in for the "o" of the title -->
      <symbol id="btnTitle" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18.6" fill="url(#titleBtnFace)" stroke="#3b3f5c" stroke-width="1.1"/>
        <circle cx="20" cy="20" r="13.4" fill="none" stroke="#4a4f70" stroke-opacity=".75" stroke-width="1.8"/>
        <circle cx="20" cy="20" r="14.8" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1"/>
        <g fill="#151727"><circle cx="15.4" cy="15.4" r="2.5"/><circle cx="24.6" cy="15.4" r="2.5"/><circle cx="15.4" cy="24.6" r="2.5"/><circle cx="24.6" cy="24.6" r="2.5"/></g>
        <g stroke="#9a1f29" stroke-width="2.2" stroke-linecap="round"><line x1="15.4" y1="15.4" x2="24.6" y2="24.6"/><line x1="24.6" y1="15.4" x2="15.4" y2="24.6"/></g>
        <ellipse cx="13" cy="10.5" rx="7" ry="3" fill="#fff" fill-opacity=".45" transform="rotate(-32 13 10.5)"/>
      </symbol>
      <!-- a black four-hole button, cross-stitched in red thread -->
      <symbol id="btn" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18.5" fill="url(#btnFace)" stroke="#000" stroke-width="1.2"/>
        <circle cx="20" cy="20" r="13.2" fill="none" stroke="#000" stroke-opacity=".7" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="14.4" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="1"/>
        <g fill="#000"><circle cx="15.5" cy="15.5" r="2.3"/><circle cx="24.5" cy="15.5" r="2.3"/><circle cx="15.5" cy="24.5" r="2.3"/><circle cx="24.5" cy="24.5" r="2.3"/></g>
        <g stroke="#8e1e26" stroke-width="2" stroke-linecap="round"><line x1="15.5" y1="15.5" x2="24.5" y2="24.5"/><line x1="24.5" y1="15.5" x2="15.5" y2="24.5"/></g>
        <g stroke="#e0606a" stroke-opacity=".35" stroke-width=".7" stroke-linecap="round"><line x1="15.8" y1="15" x2="24.8" y2="24"/><line x1="24.8" y1="15" x2="15.8" y2="24"/></g>
        <ellipse cx="13" cy="10.5" rx="6.5" ry="2.8" fill="#fff" fill-opacity=".16" transform="rotate(-32 13 10.5)"/>
      </symbol>
    </defs>
  </svg>

  <div id="stage">
    <canvas id="scene" width="1920" height="1080"></canvas>

    <div id="menu">
      <header class="brand">
        <h1 class="title" aria-label="Coraline">C<svg class="o-btn" aria-hidden="true"><use href="#btnTitle"/></svg>raline</h1>
        <svg class="thread" viewBox="0 0 760 70" aria-hidden="true">
          <path class="thread-line" d="M8 38 C 90 18, 150 58, 230 36 S 380 20, 460 40 S 610 56, 650 34"/>
          <g class="needle" transform="translate(648 34) rotate(-14)">
            <path d="M0 -3.2 L92 -1.2 Q104 0 92 1.2 L0 3.2 Q-8 0 0 -3.2 Z" fill="url(#needle)"/>
            <ellipse cx="9" cy="0" rx="6" ry="1.3" fill="#0b0d18"/>
          </g>
        </svg>
        <p class="tagline">Be careful what you wish for</p>
      </header>

      <section class="panel">
        <div class="glass"></div>
        <svg class="stitches" viewBox="0 0 520 452" preserveAspectRatio="none" aria-hidden="true">
          <rect class="stitch-shadow" x="16" y="17" width="488" height="418" rx="16"/>
          <rect class="stitch" x="16" y="16" width="488" height="418" rx="16"/>
        </svg>
        <svg class="corner tl"><use href="#btn"/></svg>
        <svg class="corner tr"><use href="#btn"/></svg>
        <svg class="corner bl"><use href="#btn"/></svg>
        <svg class="corner br"><use href="#btn"/></svg>

        <nav class="items">
          <a class="item primary" href="#start"><svg class="ico"><use href="#btn"/></svg><span>Start Adventure</span></a>
          <a class="item" href="#continue"><svg class="ico"><use href="#btn"/></svg><span>Continue</span></a>
          <a class="item" href="#options"><svg class="ico"><use href="#btn"/></svg><span>Options</span></a>
          <a class="item" href="#credits"><svg class="ico"><use href="#btn"/></svg><span>Credits</span></a>
          <a class="item" href="#quit"><svg class="ico"><use href="#btn"/></svg><span>Quit</span></a>
        </nav>
      </section>
    </div>
  </div>

  <script src="js/stage.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
